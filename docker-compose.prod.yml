services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vouchers
      POSTGRES_USER: voucher_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
  web:
    build: .
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://voucher_user:${POSTGRES_PASSWORD}@db:5432/vouchers
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-مدير النظام}
      COOKIE_SECURE: "1"
    networks: [internal]
networks:
  internal:
volumes:
  postgres_data:
